# Base Model Configuration (7B Instruct models fit comfortably in 15GB T4 VRAM in 4-bit)
model:
  base_model_id: "Qwen/Qwen2.5-7B-Instruct"   # Alternatives: "mistralai/Mistral-7B-Instruct-v0.3"
  max_seq_length: 1024                        # Keep <= 1024 on T4 to prevent OOM during attention

# Dataset Paths (Committed by Member 2)
data:
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"

# QLoRA Hyperparameters
lora:
  r: 16                                       # Sweep values: 16, 32
  lora_alpha: 32                              # Standard rule: alpha = 2 * r
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Training Arguments (Tuned for 15GB T4 GPU)
training:
  output_dir: "/content/drive/MyDrive/domain-expert-qlora/checkpoints"
  final_adapter_dir: "/content/drive/MyDrive/domain-expert-qlora/final_adapter"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4              # Effective batch size = 2 * 4 = 8
  learning_rate: 0.0002                       # 2e-4 standard for QLoRA
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  optim: "paged_adamw_8bit"                   # Prevents VRAM spikes on T4
  fp16: true                                  # T4 supports fp16 (do NOT set bf16: true on T4)
  bf16: false
  gradient_checkpointing: true                # Saves ~40% activation VRAM
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 25
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2
  seed: 42

# Report Artifacts (Committed to GitHub for README & Submission)
artifacts:
  loss_plot_path: "training/logs/loss_curves.png"
  metrics_json_path: "training/logs/training_metrics.json"